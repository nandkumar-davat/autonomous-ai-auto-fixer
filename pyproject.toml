[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autofixer"
version = "0.1.0"
description = "Autonomous AI Auto-Fixer for technical debt and security vulnerabilities"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "httpx>=0.24.0",
    "anthropic>=0.5.0",
    "openai>=1.0.0",
    "PyMuPDF>=1.22.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "GitPython>=3.1.0",
    "azure-devops>=7.1.0b4",
    "PyGithub>=1.59.0",
    "azure-identity>=1.13.0",
    "azure-keyvault-secrets>=4.7.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "structlog>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
]

[project.scripts]
autofixer = "autofixer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
