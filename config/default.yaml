# Default Configuration for Autonomous AI Auto-Fixer

agent:
  mode: dry-run  # options: dry-run, fix
  max_retries: 3
  risk_policy: low-risk-only
  base_branch: main

vcs:
  primary: azure-devops
  azure_devops:
    org_url: "https://dev.azure.com/your-org"
    project: "your-project"
  github:
    app_id: null
    installation_id: null

llm:
  provider: github-copilot
  providers:
    - github_copilot
    - gemini
    - openrouter
    - ollama
  model: auto
  temperature: 0.0
  max_tokens: 4096

secrets:
  source: environment  # Switch to environment mode to use GITHUB_TOKEN
  vault_url: "https://your-actual-vault.vault.azure.net/"  # Replace with your vault
  tenant_id: null
  github_token_secret_name: "github-token"

# ── Severity Filters ────────────────────────────────────────────────
# Per-scanner thresholds controlling which findings enter the pipeline.
severity_filters:
  mend:
    min_severity: HIGH
    include_types:
      - VULNERABILITY
    exclude_types: []
  trivy:
    min_severity: HIGH
    include_types:
      - VULNERABILITY
      - MISCONFIGURATION
    exclude_types: []
  sonarqube:
    min_severity: MAJOR
    include_types:
      - BUG
      - VULNERABILITY
      - CODE_SMELL
    exclude_types: []

# ── Ingestion ────────────────────────────────────────────────────────
ingestion:
  sonarqube:
    url: null
    prioritize_bugs: true
  mend:
    enabled: true
  trivy:
    enabled: true

# ── Remediation ──────────────────────────────────────────────────────
remediation:
  priority_order:
    - BUG
    - VULNERABILITY
    - BLOCKER
    - CRITICAL
    - MAJOR  # Requires approval
    - HIGH   # Requires approval
  approval_required:
    - MAJOR
    - HIGH
  context_lines: 50

# ── Validation ───────────────────────────────────────────────────────
validation:
  linters:
    python: ["flake8", "black", "isort"]
    javascript: ["eslint"]
    java: ["checkstyle"]
  build_verification:
    enabled: false
